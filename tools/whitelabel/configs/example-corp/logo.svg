<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ExampleCorp placeholder logo -->
  <!-- Replace this file with the actual company logo (SVG, PNG, or JPG, min 512×512). -->

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1e4a75"/>

  <!-- Stylised "E" letterform -->
  <rect x="148" y="148" width="48" height="216" rx="8" fill="#ffffff"/>
  <rect x="148" y="148" width="216" height="48" rx="8" fill="#ffffff"/>
  <rect x="148" y="232" width="160" height="48" rx="8" fill="#ffffff"/>
  <rect x="148" y="316" width="216" height="48" rx="8" fill="#ffffff"/>

  <!-- Company name underneath (visible at large sizes) -->
  <text
    x="256"
    y="460"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="40"
    font-weight="600"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="4"
  >EXAMPLECORP</text>
</svg>
