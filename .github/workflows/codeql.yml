name: SAST — CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  # DO-1-004: false — never cancel CodeQL; a missed security scan is worse than a queued run
  cancel-in-progress: false

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    if: false  # DISABLED until further notice
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # C# — explicit build so CodeQL can trace it
      - name: Set up .NET (C# only)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build C# (C# only)
        if: matrix.language == 'csharp'
        run: dotnet build src/Lumio.Api --configuration Release --no-incremental

      # JavaScript/TypeScript — autobuild handles Next.js
      - name: Set up Node (JS only)
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/lumio-web/package-lock.json

      - name: Install JS deps (JS only)
        if: matrix.language == 'javascript'
        run: npm ci
        working-directory: src/lumio-web

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
