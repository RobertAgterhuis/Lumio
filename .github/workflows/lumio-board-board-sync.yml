name: Lumio Board Sync

on:
  pull_request:
    types: [opened, ready_for_review, closed]
  push:
    branches:
      - main

jobs:
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scan
        id: trufflehog
        uses: trufflesecurity/trufflehog-actions-scan@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Write secret scan result
        if: always()
        run: |
          STATUS="${{ steps.trufflehog.outcome == 'success' && 'CLEAN' || 'FAIL' }}"
          mkdir -p docs/security
          echo "# Secret Scan Report" > docs/security/sprint-secret-scan.md
          echo "PR: ${{ github.event.pull_request.number }}" >> docs/security/sprint-secret-scan.md
          echo "Status: $STATUS" >> docs/security/sprint-secret-scan.md
          echo "Run: ${{ github.run_id }}" >> docs/security/sprint-secret-scan.md

      - name: Fail build on detected secrets
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "::error::SECRET_SCAN_FAIL – TruffleHog detected verified secrets. Merge is blocked. Escalate to Security Architect."
          exit 1

  sync-board:
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write

    steps:
      - name: Move linked issues to In Review when PR opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const issueNumbers = [...body.matchAll(/(?:closes?|fixes?|resolves?)\s+#(\d+)/gi)]
              .map(m => parseInt(m[1]));
            for (const num of issueNumbers) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  labels: ['status: in-review']
                });
                console.log(`Labeled #${num} as in-review`);
              } catch (e) {
                console.warn(`Could not label #${num}: ${e.message}`);
              }
            }

      - name: Close linked issues and mark Done when PR merged
        if: >
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const issueNumbers = [...body.matchAll(/(?:closes?|fixes?|resolves?)\s+#(\d+)/gi)]
              .map(m => parseInt(m[1]));
            for (const num of issueNumbers) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  state: 'closed'
                });
                console.log(`Closed issue #${num}`);
              } catch (e) {
                console.warn(`Could not close #${num}: ${e.message}`);
              }
            }
